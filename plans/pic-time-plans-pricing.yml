specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Pic-Time
providerId: pic-time
created: '2026-07-04'
modified: '2026-07-04'
reconciled: false
tags:
- Photography
- Client Galleries
- Print Sales
- Subscription
- Plans
description: >-
  Pic-Time sells subscription access to its gallery-delivery, proofing, and
  print-sales platform directly to photographers - there is no API usage to
  meter because no public developer API exists. Four tiers (Free, Beginner,
  Professional, Advanced) scale primarily on photo/video storage and feature
  access (custom branding, slideshows, blogs, smart search, multi-brand
  support), with a store commission on Pic-Time-collected print/product sales
  that decreases at higher tiers.
notes: >-
  Prices and storage figures were captured from Pic-Time's public pricing page
  on the review date and are subject to change; verify current rates before
  quoting. Multi-brand add-ons on the Advanced plan are priced per additional
  brand ($6/month as published).
sources:
- https://www.pic-time.com/pricing/client-delivery-suite
- https://blog.pic-time.com/news/pic-time-complete-new-plans-2022/
plans:
- id: pic-time-free
  name: Free
  type: free
  description: >-
    Essential tools for photographers getting started - basic client
    galleries, print store access, and basic design tools with sales
    automations.
  entries:
  - label: Photo Storage
    name: free_photo_storage
    type: usage
    metric: storage_gb
    limit: 10
    timeFrame: rolling
    geo: global
    unit: 1
    price: '$0'
    userMultiplied: false
  - label: Video Storage
    name: free_video_storage
    type: usage
    metric: storage_gb
    limit: 1
    timeFrame: rolling
    geo: global
    unit: 1
    price: '$0'
    userMultiplied: false
  elements:
  - name: Basic Client Galleries
  - name: Print Store Access
  - name: Basic Design Tools
  - name: Sales Automations
- id: pic-time-beginner
