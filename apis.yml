description: Pic-Time is an online gallery, proofing, and print-sales delivery platform
  for professional photographers - client galleries, slideshows, an integrated
  print store, and studio-management integrations. Pic-Time does not publish a
  public developer API, API reference, or OpenAPI specification. Automation is
  limited to a Zapier integration (three triggers - New Gallery Visitor, New Order
  Placed, Main Client Gallery Invite Sent - and one action, Create New Gallery) plus
  private, bilaterally-arranged partner integrations (HoneyBook, Studio Ninja,
  Light Blue, StyleCloud, the Pic-Time Connect WordPress plugin) that are not
  documented for third-party developers. No API keys, endpoints, or SDKs are
  published for general developer use.
